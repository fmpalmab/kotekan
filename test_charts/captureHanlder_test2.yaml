type: config
log_level: DEBUG
buffer_depth: 64 #16
packets_per_frame: 512
packet_size: 5376 #5482
cpu_affinity: [0,1]

# Buffer to hold captured network packets
network_capture_buf:
  kotekan_buffer: standard
  num_frames: buffer_depth
  frame_size: packets_per_frame * packet_size 
  numa_node: 0

# DPDK Stage to capture network packets
dpdk:
  kotekan_stage: dpdkCore
  lcore_cpu_map: [3]
  main_lcore_cpu: 4
  lcore_port_map:
    - [0]
  max_rx_pkt_len: 9000
  num_mbufs: 9600
  handlers:
    - dpdk_handler: captureHandler # Use captureHandler to capture packets
      out_buf: network_capture_buf
      
