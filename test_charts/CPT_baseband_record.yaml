type: config
log_level: INFO
buffer_depth: 32 #16
packets_per_frame: 256
packet_payload_size: 5376
cpu_affinity: [0,1]

main_pool:
  kotekan_metadata_pool: BasebandMetadata
  num_metadata_objects: buffer_depth

# Buffer to hold captured network packets
network_capture_buf:
  kotekan_buffer: standard
  num_frames: buffer_depth
  frame_size:  packets_per_frame * packet_payload_size 
  numa_node: 0
  metadata_pool: main_pool
                           
# DPDK Stage to capture network packets
dpdk:
  kotekan_stage: dpdkCore
  lcore_cpu_map: [3]
  main_lcore_cpu: 4
  lcore_port_map:
    - [0]
  max_rx_pkt_len: 9000
  num_mbufs: 9600
  handlers:
    - dpdk_handler: rfsocHandlerCPT # Use captureHandler to capture packets
      out_buffer: network_capture_buf


# Monitoring stages 
#hexDump: # print hex dump of captured packets for debugging
 # kotekan_stage: hexDump
  #in_buf: network_capture_buf

inspect_frame:
  kotekan_stage: restInspectFrame
  in_buf: network_capture_buf

raw_file_write:
  kotekan_stage: BasebandWriter
  samples_per_data_set: 1024 # 256 packets x 4 spectra/packet
  num_elements: 1344 # 2pol x 672chan
  in_buf: network_capture_buf
  root_path: /data
  dump_timeout: 2

