---
# Single-port RFSoC capture for plot_raw_intensity_64.py.
# This configuration writes raw network frames only; it does not use BasebandWriter.

########################
#### Global options ####
########################
type: config
log_level: info
cpu_affinity: [0, 1]

num_elements: 32
n_channels_per_packet: 168
packets_per_spectrum: 4

buffer_depth: 60
spectra_per_dataset: 15360
bytes_per_dataset: n_channels_per_packet * packets_per_spectrum * spectra_per_dataset
capture_n_frames: 40

###########################
##### Pipeline buffers ####
###########################

main_pool:
  kotekan_metadata_pool: chartsMetadata
  num_metadata_objects: buffer_depth * 10

network_capture_buf:
  kotekan_buffer: standard
  num_frames: buffer_depth
  frame_size: bytes_per_dataset * num_elements
  numa_node: 0
  metadata_pool: main_pool
  zero_new_frames: true

mask_buffer_zeros:
  kotekan_buffer: standard
  num_frames: buffer_depth
  frame_size: spectra_per_dataset
  numa_node: 0
  metadata_pool: main_pool

##########################
#### Pipeline stages #####
##########################

dpdk:
  kotekan_stage: dpdkCore
  lcore_cpu_map: [3]
  main_lcore_cpu: 4
  lcore_port_map:
    - [0]
  max_rx_pkt_len: 9000
  num_mbufs: 9600
  mbuf_data_size: 9000
  handlers:
    - dpdk_handler: rfsocHandlerNoClk
      out_buffer: network_capture_buf
      alignment: 4000
      mask_buf: mask_buffer_zeros
    - dpdk_handler: none

zero_samples:
  kotekan_stage: zeroSamples
  out_buf: network_capture_buf
  lost_samples_buf: mask_buffer_zeros
  zero_value: 0
  sample_size: 21504

raw_file_write:
  kotekan_stage: rawFileWrite
  in_buf: network_capture_buf
  file_name: network_0
  base_dir: /data/32_test
  file_ext: bin
  num_frames_per_file: 1
  exit_after_n_files: capture_n_frames

inspect_frame:
  kotekan_stage: restInspectFrame
  in_buf: network_capture_buf

